name: Prettier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-formatting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@26.8.2

      - name: Run Prettier
        run: pnpm run check:formatting
